</text><text x="542" y="102" font-size="13" font-family="monospace">- string nombre</text><text x="542" y="122" font-size="13" font-family="monospace">- map&lt;string, int&gt; vecinos</text><text x="542" y="142" font-size="13" font-family="monospace">- map&lt;string, int&gt; tablaCostos</text><text x="542" y="176" font-size="13" font-family="monospace">+ Enrutador()</text><text x="542" y="196" font-size="13" font-family="monospace">+ Enrutador(string)</text><text x="542" y="216" font-size="13" font-family="monospace">+ string getNombre()</text><text x="542" y="236" font-size="13" font-family="monospace">+ map getVecinos()</text><text x="542" y="256" font-size="13" font-family="monospace">+ map getTablaCostos()</text><text x="542" y="276" font-size="13" font-family="monospace">+ bool esVecino(string)</text><text x="542" y="296" font-size="13" font-family="monospace">+ int getCosto(string)</text><text x="542" y="316" font-size="13" font-family="monospace">+ void agregarVecino(string, int)</text><text x="542" y="336" font-size="13" font-family="monospace">+ bool eliminarVecino(string)</text><text x="542" y="356" font-size="13" font-family="monospace">+ void inicializarTabla()</text><text x="542" y="376" font-size="13" font-family="monospace">+ void actualizarTabla(map)</text><text x="542" y="396" font-size="13" font-family="monospace">+ void mostrarTabla()</text><line x1="390" y1="150" x2="530" y2="150" stroke="black" stroke-width="1.5"/><polygon points="390,150 402,143 414,150 402,157" fill="black"/><text x="392" y="172" font-size="14">1</text><text x="512" y="142" font-size="14">N</text><text x="460" y="132" text-anchor="middle" font-size="12" font-style="italic">contiene</text><text x="30" y="450" font-size="12">Acceso: (+) público, (-) privado. Los enlaces son bidireccionales: el nombre del vecino se guarda como string (no hay punteros entre enrutadores).</text></svg>