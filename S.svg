<text x="30" y="496" font-size="12">Acceso: (+) público, (-) privado. Los enlaces son bidireccionales: el nombre del vecino se guarda como string (no hay punteros entre enrutadores).</text>
<text x="30" y="514" font-size="12">Composición (rombo negro): la Red es dueña de sus Enrutadores; si la Red se destruye, sus enrutadores también. dijkstra() es privado: solo lo usa actualizarTablas().</text>
